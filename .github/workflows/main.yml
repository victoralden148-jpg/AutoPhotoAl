name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Ekstrak project dari zip
        run: unzip -q AutoPhotoAI.zip -d project

      - name: Build debug APK
        working-directory: project/AutoPhotoAI
        run: |
          set +e
          gradle assembleDebug --console=plain > build.log 2>&1
          STATUS=$?
          echo Ringkasan-error >> $GITHUB_STEP_SUMMARY
          grep -A3 -e ^e: -e wrong build.log | head -80 >> $GITHUB_STEP_SUMMARY
          tail -n 40 build.log
          exit $STATUS

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hasil-build
          path: |
            project/AutoPhotoAI/build.log
            project/AutoPhotoAI/app/build/outputs/apk/debug/app-debug.apk
